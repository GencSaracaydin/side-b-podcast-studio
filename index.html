&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;

  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;

    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;

      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

    );

   * @param {string} property
   */

  };

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {

      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };

      postToHost(&quot;open-external&quot;, { href });
    }

      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };

  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},

      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }

                pendingStateWrites.delete(id);

      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;

      element = event.target.parentElement;

      return;
    }

        id = decodeURIComponent(href.slice(1));

        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

      });

  syncTheme();

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;sideb-studio&#x27;);
  const $ = s =&gt; root.querySelector(s);
  const defaults = {name:&#x27;Maya Chen&#x27;,expertise:&#x27;Designer and repair studio founder&#x27;,focus:&#x27;Leaving a corporate design job to open a repair studio&#x27;,audience:&#x27;Curious creatives&#x27;,quote:&#x27;Repair teaches you to pay attention.&#x27;};
  const labels = {story:&#x27;The story&#x27;,tension:&#x27;The tension&#x27;,craft:&#x27;The craft&#x27;};
  const hints = {story:&#x27;Invite a scene they can take you back to.&#x27;,tension:&#x27;Find the trade-off behind the tidy story.&#x27;,craft:&#x27;Get close to the decisions only they can explain.&#x27;};
  let state = {version:1,brief:{...defaults},draft:{...defaults},angle:&#x27;story&#x27;,view:&#x27;questions&#x27;,takes:{},expanded:[],selected:[],duration:30};
  let pendingBrief = null;
  let saveTimer;
  let latestLocalUpdate = 0;
  const esc = s =&gt; String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const cleanEnd = s =&gt; String(s).trim().replace(/[.!?]+$/,&#x27;&#x27;);
  const lowerFirst = s =&gt; /^[A-Z][a-z]/.test(s) ? s[0].toLowerCase()+s.slice(1) : s;
  const icon = name =&gt; `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
  function icons(){if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});}
  function q(id,label,text,alt,why,follow){return {id,label,text,alt,why,follow,angle:state.angle};}
  function questions(){
    const b=state.brief,focus=cleanEnd(b.focus),quote=cleanEnd(b.quote),audience=lowerFirst(b.audience),job=b.expertise;
    const sample=b.expertise===defaults.expertise &amp;&amp; b.focus===defaults.focus;
    const all={
      story:[
        q(&#x27;story-0&#x27;,&#x27;Start with a scene&#x27;,sample?&#x27;What object on your repair bench would tell us the most about your work?&#x27;:`Your title is “${job}.” What object or place would show us what that work really looks like?`,sample?&#x27;If we walked into your studio today, what unfinished repair would you show us first?&#x27;:&#x27;If we spent a morning alongside you, what would you want us to notice first?&#x27;,&#x27;Starts with something tangible and reveals how your guest sees.&#x27;,sample?&#x27;What would I miss if I only saw the finished repair?&#x27;:&#x27;What would I miss if I only saw the finished result?&#x27;),
        q(&#x27;story-1&#x27;,&#x27;Find the turning point&#x27;,sample?&#x27;Take us to a moment when staying at your old job began to feel harder than leaving.&#x27;:`Thinking about “${focus},” what is a moment you still replay?`,sample?&#x27;What happened on the day that leaving your job became a real possibility?&#x27;:`Let’s start with “${focus}.” What small, vivid detail takes you back?`,&#x27;Invites a specific scene instead of a polished life summary.&#x27;,&#x27;What did you do the next morning?&#x27;),
        q(&#x27;story-2&#x27;,&#x27;Make the quote real&#x27;,quote?`You said, “${quote}.” What happened that made that real for you?`:&#x27;What is a small moment in your work that changed how you see it?&#x27;,quote?`When has “${quote}” been hardest to put into practice?`:&#x27;When has your own advice been hardest to put into practice?&#x27;,&#x27;Connects a belief to lived experience. Check the quote against your source before recording.&#x27;,&#x27;Who else was there, and what do you think they remember?&#x27;)
      ],
      tension:[
        q(&#x27;tension-0&#x27;,&#x27;Look for the contradiction&#x27;,sample?&#x27;Which habit from your old job have you had to unlearn in your repair studio?&#x27;:`Thinking about “${focus},” what habit did you have to unlearn?`,sample?&#x27;Which habit from your old job do you still rely on more than you expected?&#x27;:`Thinking about “${focus},” what familiar habit turned out to be useful?`,&#x27;Makes change more complicated than a simple before-and-after story.&#x27;,&#x27;When did you first notice that habit getting in the way?&#x27;),
        q(&#x27;tension-1&#x27;,&#x27;Name the trade-off&#x27;,sample?&#x27;What do customers ask you to restore that you think is better left changed?&#x27;:&#x27;When does doing your best work mean disappointing someone?&#x27;,sample?&#x27;Tell us about a repair you chose to turn down. What made it the wrong project?&#x27;:&#x27;What is a request you have turned down that was difficult to explain?&#x27;,&#x27;Reveals the negotiation and judgment behind the work.&#x27;,&#x27;How do you explain your decision without imposing your taste?&#x27;),
        q(&#x27;tension-2&#x27;,&#x27;Challenge the easy advice&#x27;,`What popular advice would you hesitate to give ${audience}?`,`What is a belief about your work that you can no longer defend?`,&#x27;Invites a considered disagreement that matters to your listeners.&#x27;,&#x27;What experience changed your mind?&#x27;)
      ],
      craft:[
        q(&#x27;craft-0&#x27;,&#x27;Get close to the work&#x27;,sample?&#x27;When a repair is done well, what should still look broken?&#x27;:&#x27;In your work, what looks like an imperfection but is actually a deliberate choice?&#x27;,sample?&#x27;How do you decide which marks of an object’s history should stay visible?&#x27;:&#x27;What tiny detail tells you whether someone understands your craft?&#x27;,&#x27;Finds a judgment call that a generic career question would miss.&#x27;,sample?&#x27;Can you describe a time you chose to leave a mark visible?&#x27;:&#x27;Can you walk us through a real example?&#x27;),
        q(&#x27;craft-1&#x27;,&#x27;Follow the second attempt&#x27;,sample?&#x27;What have you repaired more than once because your first solution didn’t hold?&#x27;:`What have you had to do twice because your first approach did not hold up?`,sample?&#x27;Which failed repair taught you something you now use every week?&#x27;:&#x27;What mistake changed how you approach your work?&#x27;,&#x27;Makes learning concrete and gives listeners something to recognize.&#x27;,&#x27;What did the second attempt teach you that the first couldn’t?&#x27;),
        q(&#x27;craft-2&#x27;,&#x27;Leave listeners with a next step&#x27;,sample?`What could ${audience} try repairing this weekend to start seeing things differently?`:`What small experiment could ${audience} try this weekend to understand your work differently?`,sample?&#x27;What is something in our homes that you wish we would try fixing before replacing?&#x27;:`What could ${audience} stop doing for one week to notice something new?`,&#x27;Ends with an approachable action, grounded in this guest’s experience.&#x27;,&#x27;What mistake should they give themselves permission to make?&#x27;)
      ]};
    return all[state.angle];
  }
  const altFollow={&#x27;story-0&#x27;:&#x27;What would we notice if we watched closely?&#x27;,&#x27;story-1&#x27;:&#x27;What happened just after that?&#x27;,&#x27;story-2&#x27;:&#x27;What did you do when your own advice was not enough?&#x27;,&#x27;tension-0&#x27;:&#x27;Can you take us to a time when that habit made a difference?&#x27;,&#x27;tension-1&#x27;:&#x27;What did you say to the person who asked?&#x27;,&#x27;tension-2&#x27;:&#x27;What experience changed your mind?&#x27;,&#x27;craft-0&#x27;:&#x27;Can you walk us through one example of that decision?&#x27;,&#x27;craft-1&#x27;:&#x27;What do you do differently now?&#x27;,&#x27;craft-2&#x27;:&#x27;What would be an easy first step?&#x27;};
  function currentQuestion(id){const item=questions().find(x=&gt;x.id===id);return item?{...item,text:state.takes[id]?item.alt:item.text,follow:state.takes[id]?altFollow[id]:item.follow}:null;}
  function notify(message){$(&#x27;#sb-notice&#x27;).textContent=message;}
  function readBrief(){const b={};Object.keys(defaults).forEach(k=&gt;b[k]=$(&#x27;#sb-&#x27;+k).value.trim());return b;}

      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
